<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>柴笑寒作品集</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #fff;
      overflow-x: hidden;
    }

    .container {
      max-width: 720px;
      width: 90%;
      padding: 60px 40px;
      text-align: center;
    }

    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: linear-gradient(135deg, #667eea, #764ba2);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 28px;
      font-size: 40px;
      box-shadow: 0 8px 32px rgba(102, 126, 234, 0.4);
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }

    .subtitle {
      font-size: 16px;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 48px;
      letter-spacing: 0.5px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .link-card {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 24px 28px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      text-decoration: none;
      color: #fff;
      transition: all 0.3s ease;
      backdrop-filter: blur(10px);
    }

    .link-card:hover {
      background: rgba(255, 255, 255, 0.14);
      border-color: rgba(102, 126, 234, 0.5);
      transform: translateY(-3px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.3);
    }

    .link-icon {
      flex-shrink: 0;
      width: 48px;
      height: 48px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
    }

    .icon-demo {
      background: linear-gradient(135deg, #667eea, #764ba2);
    }

    .icon-github {
      background: linear-gradient(135deg, #333, #555);
    }

    .icon-article {
      background: linear-gradient(135deg, #e17055, #f9ca55);
    }

    .link-body {
      flex: 1;
      text-align: left;
    }

    .link-title {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .link-desc {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.5);
      word-break: break-all;
    }

    .link-arrow {
      flex-shrink: 0;
      color: rgba(255, 255, 255, 0.3);
      font-size: 20px;
      transition: transform 0.3s ease, color 0.3s ease;
    }

    .link-card:hover .link-arrow {
      color: #667eea;
      transform: translateX(4px);
    }

    .section-label {
      font-size: 13px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.35);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin: 12px 0 10px;
      padding-left: 4px;
      text-align: left;
    }

    .footer {
      margin-top: 48px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.3);
    }
  </style>
</head>
